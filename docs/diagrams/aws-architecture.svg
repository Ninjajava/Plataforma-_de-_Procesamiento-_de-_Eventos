<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#4f647d"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172a43} .title{font-size:26px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px}.line{fill:none;stroke:#4f647d;stroke-width:2;marker-end:url(#arrow)}.box{fill:white;stroke:#7297c3;stroke-width:1.5;rx:12}</style><rect width="1280" height="850" fill="#f3f6fb"/><text x="38" y="47" class="title">Ticketing · Arquitectura AWS propuesta</text><text x="38" y="75" class="small">Terraform validado con mocks · Sin despliegue AWS · API todavía sin identidad de cliente</text><rect x="245" y="115" width="980" height="625" rx="20" fill="#e8eff9" stroke="#8aa8cb"/><text x="267" y="145" class="label">Cuenta por entorno · VPC privada en dos zonas · Sin NAT ni Internet Gateway</text><rect x="28" y="285" width="185" height="110" class="box"/><text x="43" y="313" class="label">Clientes privados</text><text x="43" y="337" class="small">VPN / red corporativa</text><text x="43" y="356" class="small">existente; fuera del módulo</text><rect x="270" y="280" width="190" height="125" class="box"/><text x="285" y="308" class="label">ALB interno</text><text x="285" y="332" class="small">TLS / ACM · puerto 443</text><text x="285" y="351" class="small">CIDRs explícitos</text><text x="285" y="370" class="small">Access logs a S3</text><rect x="505" y="180" width="290" height="130" class="box"/><text x="520" y="208" class="label">Fargate · Zona A</text><text x="520" y="232" class="small">API + consumidor + publicador</text><text x="520" y="251" class="small">Expirador en cada réplica</text><text x="520" y="270" class="small">Usuario 10001 · root FS read-only</text><rect x="505" y="400" width="290" height="130" class="box"/><text x="520" y="428" class="label">Fargate · Zona B</text><text x="520" y="452" class="small">Mismo artefacto por digest</text><text x="520" y="471" class="small">Min. 2 tareas · CPU autoscaling</text><text x="520" y="490" class="small">IAM task / execution separados</text><rect x="860" y="180" width="335" height="100" class="box"/><text x="875" y="208" class="label">DynamoDB</text><text x="875" y="232" class="small">Condiciones + transacciones + outbox</text><text x="875" y="251" class="small">On-demand · KMS · PITR</text><rect x="860" y="330" width="335" height="100" class="box"/><text x="875" y="358" class="label">SQS Standard + DLQ</text><text x="875" y="382" class="small">At-least-once · procesamiento idempotente</text><text x="875" y="401" class="small">Cifrado KMS · redrive tras 8 intentos</text><rect x="860" y="485" width="335" height="100" class="box"/><text x="875" y="513" class="label">Endpoints privados</text><text x="875" y="537" class="small">ECR, SQS, Logs y Secrets Manager</text><text x="875" y="556" class="small">Gateway endpoints: DynamoDB y S3</text><rect x="505" y="600" width="690" height="105" class="box"/><text x="520" y="628" class="label">Operación y gobernanza</text><text x="520" y="652" class="small">CloudWatch: logs, alarmas y dashboard · VPC Flow Logs · S3 access logs</text><text x="520" y="671" class="small">Roles IAM acotados · tags · presupuesto opcional de cuenta · estado S3/KMS con locking</text><path d="M213 340H270" class="line"/><path d="M460 315H480V245H505" class="line"/><path d="M460 370H480V460H505" class="line"/><path d="M795 245H860" class="line"/><path d="M795 450H825V380H860" class="line"/><path d="M795 475H840V535H860" class="line"/><text x="315" y="430" class="small">Solo ALB → tareas: 8080</text><text x="275" y="647" class="small">Sin IP pública</text><text x="275" y="670" class="small">Sin salida abierta</text><rect x="28" y="772" width="1197" height="48" rx="10" fill="#fff1d9"/><text x="44" y="801" class="small">Límite: infraestructura privada no sustituye autenticación, autorización ni pagos. La entrada pública requiere trabajo adicional.</text></svg>
