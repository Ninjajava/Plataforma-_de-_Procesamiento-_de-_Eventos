name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - name: Format and schema validation
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: Mocked AWS architecture plans
        run: terraform -chdir=infra/terraform test
      - name: State bootstrap validation
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit tests and coverage gate
        run: mvn -B clean verify
      - name: Save unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: target/site/jacoco
      - name: Start DynamoDB Local
        run: docker compose up -d dynamodb
      - name: Real DynamoDB integration tests
        env:
          TEST_DYNAMODB_ENDPOINT: http://localhost:8000
        run: mvn -B -Dtest=DynamoIntegrationTest test
      - name: Stop infrastructure
        if: always()
        run: docker compose down
